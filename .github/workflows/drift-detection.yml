name: Terraform Drift Detection

on:
  # schedule:
    # Run daily at 6 AM UTC
    # - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check (dev/prod/all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - prod

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift-detection:
    name: Detect Configuration Drift
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
        
    steps:
      - name: Skip if not selected
        if: github.event.inputs.environment != 'all' && github.event.inputs.environment != matrix.environment
        run: |
          echo "Skipping ${{ matrix.environment }} - not selected"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          role-session-name: terraform-drift-detection-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Plan (Drift Detection)
        id: drift-plan
        run: |
          terraform plan -detailed-exitcode -no-color > drift-plan.txt 2>&1
          exit_code=$?
          echo "exit-code=$exit_code" >> $GITHUB_OUTPUT
          
          if [ $exit_code -eq 2 ]; then
            echo "drift-detected=true" >> $GITHUB_OUTPUT
            echo "🚨 Configuration drift detected in ${{ matrix.environment }}"
          elif [ $exit_code -eq 0 ]; then
            echo "drift-detected=false" >> $GITHUB_OUTPUT
            echo "✅ No drift detected in ${{ matrix.environment }}"
          else
            echo "drift-detected=error" >> $GITHUB_OUTPUT
            echo "❌ Error during drift detection in ${{ matrix.environment }}"
          fi
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Upload Drift Report
        if: steps.drift-plan.outputs.drift-detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.environment }}-${{ github.run_number }}
          path: environments/${{ matrix.environment }}/drift-plan.txt
          retention-days: 30

      - name: Create Drift Issue
        if: steps.drift-plan.outputs.drift-detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const driftPlan = fs.readFileSync('environments/${{ matrix.environment }}/drift-plan.txt', 'utf8');
            const truncatedPlan = driftPlan.length > 50000 ? 
              driftPlan.substring(0, 50000) + '\n... (truncated - see artifact for full output)' : 
              driftPlan;
            
            const issueTitle = `🚨 Configuration Drift Detected - ${{ matrix.environment }} Environment`;
            const issueBody = `
            ## Configuration Drift Alert
            
            **Environment**: ${{ matrix.environment }}
            **Detection Time**: ${new Date().toISOString()}
            **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ### Detected Changes
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            ### Recommended Actions
            
            1. **Review Changes**: Analyze the drift to understand what changed outside of Terraform
            2. **Investigate Cause**: Determine if changes were:
               - Manual modifications in AWS console
               - Changes by other automation tools
               - Resource auto-scaling or auto-healing
               - Security patches or updates
            3. **Remediate**: Choose appropriate action:
               - Update Terraform configuration to match current state
               - Revert manual changes to match Terraform state
               - Import resources if they were created outside Terraform
            
            ### Severity Assessment
            
            - [ ] **Low**: Cosmetic changes (tags, descriptions)
            - [ ] **Medium**: Configuration changes that don't affect functionality
            - [ ] **High**: Changes that could impact security or availability
            - [ ] **Critical**: Changes that pose immediate risk
            
            ### Next Steps
            
            - [ ] Assign to infrastructure team
            - [ ] Investigate root cause
            - [ ] Plan remediation
            - [ ] Update procedures to prevent recurrence
            
            ---
            
            *This issue was automatically created by the drift detection workflow.*
            `;
            
            // Check if similar issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detection,${{ matrix.environment }}'
            });
            
            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['drift-detection', '${{ matrix.environment }}', 'infrastructure']
              });
            } else {
              // Update existing issue with new drift information
              const existingIssue = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## New Drift Detected - ${new Date().toISOString()}\n\n${issueBody}`
              });
            }

      - name: Notify Slack - Drift Detected
        if: steps.drift-plan.outputs.drift-detected == 'true'
        run: |
          echo "🚨 Configuration drift detected in ${{ matrix.environment }}"
          echo "Drift details uploaded as artifact: drift-report-${{ matrix.environment }}-${{ github.run_number }}"
          # Add Slack webhook notification here
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Terraform drift detected in ${{ matrix.environment }} environment"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack - No Drift
        if: steps.drift-plan.outputs.drift-detected == 'false'
        run: |
          echo "✅ No configuration drift detected in ${{ matrix.environment }}"
          # Optional: Add success notification to Slack

      - name: Auto-remediate Known Drift Patterns
        if: steps.drift-plan.outputs.drift-detected == 'true'
        run: |
          echo "Checking for auto-remediable drift patterns..."
          
          # Example: Auto-remediate tag changes
          if grep -q "tags" environments/${{ matrix.environment }}/drift-plan.txt; then
            echo "Tag drift detected - this could be auto-remediated"
            # Add logic to automatically fix tag drift if desired
          fi
          
          # Example: Auto-remediate security group rule changes
          if grep -q "security_group_rule" environments/${{ matrix.environment }}/drift-plan.txt; then
            echo "Security group drift detected - requires manual review"
          fi

  drift-summary:
    name: Drift Detection Summary
    runs-on: ubuntu-latest
    needs: drift-detection
    if: always()
    
    steps:
      - name: Generate Summary Report
        run: |
          echo "# Drift Detection Summary - $(date -u)" > drift-summary.md
          echo "" >> drift-summary.md
          echo "## Results" >> drift-summary.md
          echo "- **Dev Environment**: ${{ needs.drift-detection.result }}" >> drift-summary.md
          echo "- **Prod Environment**: ${{ needs.drift-detection.result }}" >> drift-summary.md
          echo "" >> drift-summary.md
          echo "## Actions Required" >> drift-summary.md
          echo "Check individual environment results and GitHub issues for details." >> drift-summary.md
          
          cat drift-summary.md

      - name: Archive Summary
        uses: actions/upload-artifact@v4
        with:
          name: drift-summary-${{ github.run_number }}
          path: drift-summary.md
          retention-days: 90
