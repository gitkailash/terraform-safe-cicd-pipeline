name: Terraform CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'environments/**'
      - 'modules/**'

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    name: Detect Environment Changes
    runs-on: ubuntu-latest
    outputs:
      dev-changed: ${{ steps.changes.outputs.dev }}
      prod-changed: ${{ steps.changes.outputs.prod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            dev:
              - 'environments/dev/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dev-changed == 'true' || needs.detect-changes.outputs.prod-changed == 'true'
    
    strategy:
      matrix:
        environment: [dev, prod]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          role-session-name: terraform-validation-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: environments/${{ matrix.environment }}

      - name: Comment PR - Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            ## Terraform Validation Results - ${{ matrix.environment }}
            
            #### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            
            <details><summary>Show Validation Output</summary>
            
            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`
            
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-validate]
    if: needs.terraform-validate.result == 'success'
    
    strategy:
      matrix:
        environment: [dev, prod]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          role-session-name: terraform-plan-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan-${{ matrix.environment }}-${{ github.sha }} -no-color
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exitcode == 2
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.sha }}
          path: environments/${{ matrix.environment }}/tfplan-${{ matrix.environment }}-${{ github.sha }}
          retention-days: 30

      - name: Comment PR - Plan Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const planOutput = `${{ steps.plan.outputs.stdout }}`;
            const truncatedOutput = planOutput.length > 60000 ? 
              planOutput.substring(0, 60000) + '\n... (truncated)' : 
              planOutput;
              
            const output = `
            ## Terraform Plan Results - ${{ matrix.environment }}
            
            #### Plan Status: \`${{ steps.plan.outputs.exitcode == 0 && 'No Changes' || steps.plan.outputs.exitcode == 2 && 'Changes Detected' || 'Error' }}\`
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${truncatedOutput}
            \`\`\`
            
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply-dev:
    name: Apply to Development
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan]
    if: |
      needs.detect-changes.outputs.dev-changed == 'true' && 
      github.ref == 'refs/heads/develop' && 
      github.event_name == 'push'
    environment: development
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          role-session-name: terraform-apply-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev-${{ github.sha }}
          path: environments/dev/

      - name: Terraform Init
        run: terraform init
        working-directory: environments/dev

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan-dev-${{ github.sha }}
        working-directory: environments/dev

      - name: Post-deployment Health Check
        run: |
          echo "Running post-deployment health checks..."
          # Add your health check commands here
          # curl -f https://your-app-dev.example.com/health || exit 1

      - name: Notify Slack - Success
        if: success()
        run: |
          echo "Deployment to dev successful - would notify Slack here"
          # Add Slack notification here

      - name: Notify Slack - Failure
        if: failure()
        run: |
          echo "Deployment to dev failed - would notify Slack here"
          # Add Slack notification here

  terraform-apply-prod:
    name: Apply to Production
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan]
    if: |
      needs.detect-changes.outputs.prod-changed == 'true' && 
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push'
    environment: 
      name: production
      url: https://your-app.example.com
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          role-session-name: terraform-apply-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ github.sha }}
          path: environments/prod/

      - name: Terraform Init
        run: terraform init
        working-directory: environments/prod

      - name: Pre-deployment Backup
        run: |
          echo "Creating pre-deployment backup..."
          # Backup critical resources before deployment
          aws s3 cp s3://your-terraform-state-bucket/prod/terraform.tfstate \
            s3://your-backup-bucket/pre-deployment-$(date +%Y%m%d-%H%M%S).tfstate

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan-prod-${{ github.sha }}
        working-directory: environments/prod

      - name: Post-deployment Health Check
        id: health-check
        run: |
          echo "Running comprehensive health checks..."
          # Add comprehensive health checks
          # curl -f https://your-app.example.com/health || exit 1
          # Check database connectivity, external services, etc.

      - name: Rollback on Health Check Failure
        if: failure() && steps.health-check.outcome == 'failure'
        run: |
          echo "Health checks failed, initiating rollback..."
          # Trigger rollback workflow
          gh workflow run terraform-rollback.yml \
            -f environment=prod \
            -f rollback_reason="Health check failure after deployment"

      - name: Notify Slack - Success
        if: success()
        run: |
          echo "Production deployment successful - would notify Slack here"
          # Add Slack notification with deployment details

      - name: Notify Slack - Failure
        if: failure()
        run: |
          echo "Production deployment failed - would notify Slack and PagerDuty here"
          # Add critical failure notifications